# Stub - the candidate may rewrite this freely.
# It must end up bringing up: ui (port 3000) + Service A + Service B.
# The example below assumes go-svc owns Service A (port 8081) and node-svc owns Service B (port 8082).
# Swap freely if you put them the other way around.

services:
  ui:
    build: ./ui
    ports: ["${UI_HOST_PORT:-3000}:3000"]
    environment:
      - NEXT_PUBLIC_MOCK=false
      - NEXT_PUBLIC_WALLET_API=http://localhost:${GO_SVC_HOST_PORT:-8081}
      - NEXT_PUBLIC_PROFILE_API=http://localhost:${NODE_SVC_HOST_PORT:-8082}
    depends_on:
      - go-svc
      - node-svc

  go-svc:
    build:
      context: .
      dockerfile: services/go-svc/Dockerfile
      target: api
    ports: ["${GO_SVC_HOST_PORT:-8081}:8081"]
    environment:
      - PORT=8081
      - ODDS_API_KEY=${ODDS_API_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_PATH=/app/data/go-svc.json
      - DATA_FOLDER_PATH=/app/data
      - KAFKA_BROKERS=kafka:9092
    volumes:
      - ./data:/app/data
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  go-worker:
    build:
      context: .
      dockerfile: services/go-svc/Dockerfile
      target: worker
    environment:
      - APP_ENVIRONMENT=production
      - APP_LOG_LEVEL=info
      - ODDS_API_KEY=${ODDS_API_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - DATABASE_PATH=/app/data/go-svc.json
      - DATA_FOLDER_PATH=/app/data
      - KAFKA_BROKERS=kafka:9092
      - KAFKA_CONSUMER_GROUP=go-svc-settlement-worker
    volumes:
      - ./data:/app/data
    depends_on:
      kafka:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  kafka:
    image: apache/kafka:3.9.0
    ports: ["${KAFKA_HOST_PORT:-39092}:9092"]
    environment:
      - KAFKA_NODE_ID=0
      - KAFKA_PROCESS_ROLES=controller,broker
      - KAFKA_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true
      - KAFKA_CLUSTER_ID=MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 5s
      timeout: 5s
      retries: 10

  node-svc:
    build:
      context: ./services/node-svc
    ports: ["${NODE_SVC_HOST_PORT:-8082}:8082"]
    environment:
      - PORT=8082
      - ODDS_API_KEY=${ODDS_API_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - KAFKA_BROKERS=kafka:9092
      - CORS_ORIGINS=http://localhost:${UI_HOST_PORT:-3000},http://127.0.0.1:${UI_HOST_PORT:-3000}
    volumes:
      - ./data:/app/data:ro
    depends_on:
      kafka:
        condition: service_healthy
